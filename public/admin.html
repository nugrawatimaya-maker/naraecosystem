        feePercentage: 7.5,
        bankName: 'Bank Central Asia (BCA) Rekening Escrow'

      });

        // Load Theme
        const savedTheme = localStorage.getItem('nara_admin_theme') || 'dark';

        document.body.className = `theme-${savedTheme}`;

        // 1. Load stored CMS data from LocalStorage (Instant)
        const savedData = localStorage.getItem('nara_cms_config');
        if (savedData) {
          try {
            const parsed = JSON.parse(savedData);
            if (parsed.heroConfig) setHeroConfig(parsed.heroConfig);
            if (parsed.needsCardsList) setNeedsCardsList(parsed.needsCardsList);
            if (parsed.partnersList) setPartnersList(parsed.partnersList);
            if (parsed.escrowSettings) setEscrowSettings(parsed.escrowSettings);
          } catch(e) {
            console.error('Error parsing stored CMS data', e);
          }
        }

        // 2. Fetch from Backend Database Server API
        fetch('/api/v1/cms-config')
          .then(res => res.json())
          .then(res => {
            if (res && res.data) {
              if (res.data.heroConfig) setHeroConfig(res.data.heroConfig);
              if (res.data.needsCardsList) setNeedsCardsList(res.data.needsCardsList);
              if (res.data.partnersList) setPartnersList(res.data.partnersList);
              if (res.data.escrowSettings) setEscrowSettings(res.data.escrowSettings);
            }
          })
          .catch(e => console.log('CMS Server Sync: menggunakan cache lokal.'));
      }, []);

        setAdminTheme(newTheme);
        document.body.className = `theme-${newTheme}`;
        localStorage.setItem('nara_admin_theme', newTheme);
        showToast(`🎨 Tema Admin diubah ke Mode ${newTheme.toUpperCase()}`);
      };

      const showToast = (msg) => {
        setToastMsg(msg);
        setTimeout(() => setToastMsg(''), 3000);
      };

        e.preventDefault();
        if (passkey === 'admin' || passkey === '123456' || passkey === 'nara') {
          setIsAuthenticated(true);
        } else {
          alert('🔑 Kata Sandi Admin Salah! (Gunakan passkey: admin)');
        }
      };

        const payload = {
          heroConfig,
          needsCardsList,
          partnersList,
          escrowSettings,
          lastSaved: new Date().toISOString()
        };
        // 1. Simpan ke LocalStorage Browser
        localStorage.setItem('nara_cms_config', JSON.stringify(payload));

        try {
          const response = await fetch('/api/v1/cms-config', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
            body: JSON.stringify(payload)
          });
          const result = await response.json();
          showToast('🚀 SUKSES! Data Berhasil Disimpan ke Database Server VPS & Web!');

          showToast('💾 Data Berhasil Disimpan ke Browser (LocalStorage)!');

          setPartnersList(DEFAULT_PARTNERS);

        });

      };

        setNeedsCardsList(needsCardsList.filter(c => c.id !== id));
        showToast('🗑️ Deal Card Dihapus!');
      };

      const handleAddPartnerSubmit = (e) => {
        e.preventDefault();

          id: 'partner-' + Date.now(),

                        onChange={(e) => setNewCard({...newCard, description: e.target.value})}
                        className="w-full input-bg rounded-xl p-3"
                      ></textarea>
                    </div>

                    <button 
                      type="submit"
                      className="px-6 py-3 bg-[#1ac1b9] hover:bg-[#16a39d] text-slate-950 font-black text-xs rounded-xl shadow-lg cursor-pointer transition-all"
                    >
                      ➕ Tambahkan Card Ke Draf CMS
                    </button>
                  </form>

                  {/* Deals List */}
                  <div className="card-bg p-6 md:p-8 space-y-4 rounded-3xl">
                    <h2 className="text-sm font-extrabold text-[#1ac1b9] uppercase tracking-wider border-b border-slate-700/30 pb-3">
                      📋 Daftar Cards Promo Aktif ({needsCardsList.length} Cards)
                    </h2>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4 text-xs">
                      {needsCardsList.map(c => (
                        <div key={c.id} className="subcard-bg p-4 rounded-2xl space-y-3 flex flex-col justify-between">
                          <div className="flex gap-3">
                            <img src={c.image} className="w-16 h-16 rounded-xl object-cover shrink-0" />
                            <div>
                              <span className="text-[10px] font-bold text-amber-500 block">{c.profitTag}</span>
                              <h3 className="font-bold text-sm leading-snug">{c.title}</h3>
                              <p className="text-[11px] opacity-75">📍 {c.location}</p>
                            </div>
                          </div>

                          <div className="pt-2 border-t border-slate-700/30 flex justify-between items-center">
                            <span className="text-[10px] text-teal-500 font-mono">{c.badge}</span>
                            <button 
                              type="button"
                              onClick={() => handleDeleteCard(c.id)}
                              className="px-3 py-1 bg-rose-950/60 hover:bg-rose-900 text-rose-300 font-bold text-xs rounded-lg border border-rose-800 cursor-pointer"
                            >
                              🗑️ Hapus Card
                            </button>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>

                </div>
              )}

              {/* SECTION 4: PARTNERS */}
              {activeSection === 'partners' && (
                <div className="space-y-6">
                  
                  {/* Add Partner Form */}
                  <form onSubmit={handleAddPartnerSubmit} className="card-bg p-6 md:p-8 space-y-4 rounded-3xl">
                    <h2 className="text-sm font-extrabold text-[#1ac1b9] uppercase tracking-wider border-b border-slate-700/30 pb-3 flex items-center gap-2">
                      <span>🤝 Tambah Mitra / Logo Baru Ke Marquee Slider</span>
                    </h2>

                    <div className="grid grid-cols-1 sm:grid-cols-3 gap-3 text-xs">
                      <div className="sm:col-span-2">
                        <label className="font-bold block mb-1">Nama Perusahaan / Bank Mitra:</label>
                        <input 
                          type="text" 
                          required
                          placeholder="Masukkan nama mitra (Contoh: Bank BSI / PT Adhi Karya)"
                          value={newPartnerName}
                          onChange={(e) => setNewPartnerName(e.target.value)}
                          className="w-full input-bg rounded-xl p-3"
                        />
                      </div>

                      <div>
                        <label className="font-bold block mb-1">Emoji Icon:</label>
                        <input 
                          type="text" 
                          placeholder="🤝, 🏦, 🏢, 🏗️"
                          value={newPartnerIcon}
                          onChange={(e) => setNewPartnerIcon(e.target.value)}
                          className="w-full input-bg rounded-xl p-3"
                        />
                      </div>
                    </div>

                    <button 
                      type="submit"
                      className="px-6 py-3 bg-[#1ac1b9] hover:bg-[#16a39d] text-slate-950 font-black text-xs rounded-xl shadow-lg cursor-pointer transition-all"
                    >
                      ➕ Tambahkan Logo Mitra
                    </button>
                  </form>

                  {/* Partner List */}
                  <div className="card-bg p-6 md:p-8 space-y-4 rounded-3xl">
                    <h2 className="text-sm font-extrabold text-[#1ac1b9] uppercase tracking-wider border-b border-slate-700/30 pb-3">
                      📋 Daftar Mitra Running Marquee ({partnersList.length} Partners)
                    </h2>

                    <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3 text-xs">
                      {partnersList.map(p => (
                        <div key={p.id} className="subcard-bg p-3.5 rounded-xl flex justify-between items-center">
                          <div className="flex items-center gap-2.5">
                            <span className="text-xl">{p.icon || '🤝'}</span>
                            <span className="font-extrabold">{p.name}</span>
                          </div>

                          <button 
                            type="button"
                            onClick={() => handleDeletePartner(p.id)}
                            className="px-2.5 py-1 bg-rose-950/60 hover:bg-rose-900 text-rose-300 font-bold text-[11px] rounded-lg border border-rose-800 cursor-pointer"
                          >
                            🗑️ Hapus
                          </button>
                        </div>
                      ))}
                    </div>
                  </div>

                </div>
              )}

              {/* SECTION 5: ESCROW CONFIG */}
              {activeSection === 'escrow' && (
                <div className="space-y-6">
                  <div className="card-bg p-6 md:p-8 space-y-5 rounded-3xl">
                    <div className="border-b border-slate-700/30 pb-3">
                      <h2 className="text-sm font-extrabold text-[#1ac1b9] uppercase tracking-wider">
                        🔒 Konfigurasi Rekening Escrow & Fee NARA
                      </h2>
                      <p className="text-xs opacity-75 mt-0.5">Pengaturan nomor rekening bersama dan persentase komisi default.</p>
                    </div>

                    <div className="space-y-4 text-xs">
                      <div>
                        <label className="font-bold block mb-1">Nomor Rekening Escrow Terdaftar:</label>
                        <input 
                          type="text" 
                          value={escrowSettings.escrowNumber}
                          onChange={(e) => setEscrowSettings({...escrowSettings, escrowNumber: e.target.value})}
                          className="w-full input-bg rounded-xl p-3 font-mono font-bold"
                        />
                      </div>

                      <div>
                        <label className="font-bold block mb-1">Nama Bank Mitra Rekening Bersama:</label>
                        <input 
                          type="text" 
                          value={escrowSettings.bankName}
                          onChange={(e) => setEscrowSettings({...escrowSettings, bankName: e.target.value})}
                          className="w-full input-bg rounded-xl p-3"
                        />
                      </div>

                      <div>
                        <label className="font-bold block mb-1">Persentase Fee Platform NARA (%):</label>
                        <input 
                          type="number" 
                          step="0.1"
                          value={escrowSettings.feePercentage}
                          onChange={(e) => setEscrowSettings({...escrowSettings, feePercentage: Number(e.target.value)})}
                          className="w-full input-bg rounded-xl p-3 font-bold text-amber-500"
                        />
                      </div>
                    </div>
                  </div>
                </div>
              )}

              {/* SECTION 6: THEME SWITCHER */}
              {activeSection === 'theme' && (
                <div className="space-y-6">
                  <div className="card-bg p-6 md:p-8 space-y-6 rounded-3xl">
                    <div className="border-b border-slate-700/30 pb-3">
                      <h2 className="text-sm font-extrabold text-[#1ac1b9] uppercase tracking-wider">
                        🎨 Panel Pengaturan Tema Gelap / Terang Dashboard Admin
                      </h2>
                      <p className="text-xs opacity-75 mt-1">Pilih tema antarmuka admin yang paling nyaman untuk manajemen harian Anda.</p>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4 text-xs">
                      
                      {/* Dark Option */}
                      <div 
                        onClick={() => changeTheme('dark')}
                        className={`p-5 rounded-2xl border-2 cursor-pointer transition-all space-y-3 ${adminTheme === 'dark' ? 'border-[#1ac1b9] bg-slate-900 ring-4 ring-teal-500/20 shadow-xl' : 'subcard-bg border-transparent hover:border-slate-500'}`}
                      >
                        <div className="flex justify-between items-center">
                          <span className="text-2xl">🌙</span>
                          {adminTheme === 'dark' && <span className="bg-teal-500 text-slate-950 text-[10px] font-black px-2 py-0.5 rounded-full">AKTIF</span>}
                        </div>
                        <div>
                          <strong className="text-sm font-extrabold block">Mode Gelap (Slate Navy)</strong>
                          <p className="text-[11px] opacity-75 mt-0.5">Latar gelap kontras tinggi, ideal untuk jam kerja malam & fokus tinggi.</p>
                        </div>
                      </div>

                      {/* Light Option */}
                      <div 
                        onClick={() => changeTheme('light')}
                        className={`p-5 rounded-2xl border-2 cursor-pointer transition-all space-y-3 ${adminTheme === 'light' ? 'border-[#1ac1b9] bg-white text-slate-900 ring-4 ring-teal-500/20 shadow-xl' : 'subcard-bg border-transparent hover:border-slate-500'}`}
                      >
                        <div className="flex justify-between items-center">
                          <span className="text-2xl">☀️</span>
                          {adminTheme === 'light' && <span className="bg-teal-500 text-slate-950 text-[10px] font-black px-2 py-0.5 rounded-full">AKTIF</span>}
                        </div>
                        <div>
                          <strong className="text-sm font-extrabold block">Mode Terang (Clean Light)</strong>
                          <p className="text-[11px] opacity-75 mt-0.5">Latar putih bersih dengan kartu berbayang halus, sangat jelas di siang hari.</p>
                        </div>
                      </div>

                      {/* Emerald Option */}
                      <div 
                        onClick={() => changeTheme('emerald')}
                        className={`p-5 rounded-2xl border-2 cursor-pointer transition-all space-y-3 ${adminTheme === 'emerald' ? 'border-[#f59e0b] bg-emerald-950 text-white ring-4 ring-amber-500/20 shadow-xl' : 'subcard-bg border-transparent hover:border-slate-500'}`}
                      >
                        <div className="flex justify-between items-center">
                          <span className="text-2xl">🌲</span>
                          {adminTheme === 'emerald' && <span className="bg-amber-400 text-slate-950 text-[10px] font-black px-2 py-0.5 rounded-full">AKTIF</span>}
                        </div>
                        <div>
                          <strong className="text-sm font-extrabold block">Mode Emerald Luxury</strong>
                          <p className="text-[11px] opacity-75 mt-0.5">Nuansa hijau botol mewah khas identitas NARA dengan aksen emas.</p>
                        </div>
                      </div>

                    </div>
                  </div>
                </div>
              )}

            </main>

            {/* Admin Footer */}
            <footer className="topbar-bg py-4 px-6 text-center text-xs opacity-60">
              © 2026 NARA Ecosystem Industrial CMS Admin. Sinkronisasi Otomatis ke index.html & tentang.html.
            </footer>

          </div>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<AdminCMSApp />);
  </script>
</body>
</html>
