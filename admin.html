<!DOCTYPE html>
<html lang="id" class="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NARA Ecosystem — CMS Admin Portal & Content Management System</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Plus Jakarta Sans', 'sans-serif'],
          },
          colors: {
            naraTeal: '#1ac1b9',
            naraDark: '#0f172a',
          }
        }
      }
    }
  </script>

  <!-- Custom Styles -->
  <style>
    body {
      margin: 0;
      background-color: #0f172a;
      color: #f8fafc;
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
    }
    .glass-card {
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
    }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
  </style>

  <!-- React 18, ReactDOM 18, Babel -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const DEFAULT_HERO = {
      headingPre: 'Terhubung dengan mitra yang tepat,',
      headingHighlight: 'capai kesepakatan yang menguntungkan.',
      description: 'NLD Hub mempertemukan investor, pemilik lahan, kontraktor, toko bangunan, notaris, dan masyarakat umum dalam satu platform Nara Ecosystem.',
      gradientBg: 'from-[#0f4c4a] via-[#136663] to-[#0d7873]'
    };

    const DEFAULT_NEEDS = [
      {
        id: 'need-01',
        title: 'Proposal Bisnis Investasi Properti (Profit 25%)',
        badge: '📊 Joint Venture Investment',
        badgeColor: 'bg-teal-50 text-teal-800 border-teal-200',
        profitTag: 'Profit 25% p.a.',
        location: 'Makassar & Maros, Sulawesi Selatan',
        image: 'https://images.unsplash.com/photo-1600585154340-be6161a56a0c?auto=format&fit=crop&w=800&q=80',
        description: 'Proposal kerjasama investasi pengembangan lahan & cluster perumahan komersial dengan skema bagi hasil terjamin via NARA Escrow.',
        actionText: 'Masuk NARA Escrow Deal Room'
      },
      {
        id: 'need-02',
        title: 'Mini Investasi Pengembangan Blok Perumahan',
        badge: '💎 Mini Investment',
        badgeColor: 'bg-amber-50 text-amber-800 border-amber-200',
        profitTag: 'Profit 20% / 6 Bulan',
        location: 'Kawasan Strategis Maros & BSD',
        image: 'https://images.unsplash.com/photo-1580587771525-78b9dba3b914?auto=format&fit=crop&w=800&q=80',
        description: 'Peluang dana investasi mini blok hunian siap bangun dengan penjaminan unit sertifikat & legalitas SHM terlindungi.',
        actionText: 'Masuk NARA Escrow Deal Room'
      },
      {
        id: 'need-03',
        title: 'Promo Jasa Agen Marketing (Diskon 50%)',
        badge: '📢 Marketing Special Promo',
        badgeColor: 'bg-[#1ac1b9]/10 text-[#0d9488] border-[#1ac1b9]/30',
        profitTag: 'Diskon Komisi 50%',
        location: 'Nasional / Seluruh Indonesia',
        image: 'https://images.unsplash.com/photo-1551836022-d5d88e9218df?auto=format&fit=crop&w=800&q=80',
        description: 'Layanan agen pemasaran & broker properti profesional NARA dengan potongan komisi penanganan 50% dan garansi listing tayang cepat.',
        actionText: 'Ambil Promo Marketing'
      },
      {
        id: 'need-04',
        title: '5 Unit Kerjasama Perumahan Sunrise City Maros',
        badge: '🏡 Developer Special Project',
        badgeColor: 'bg-emerald-50 text-emerald-800 border-emerald-200',
        profitTag: 'Profit Hingga Rp 5 Jt / Unit',
        location: 'Sunrise City Maros, Sulawesi Selatan',
        image: 'https://images.unsplash.com/photo-1512917774080-9991f1c4c750?auto=format&fit=crop&w=800&q=80',
        description: 'Kerjasama eksklusif 5 unit hunian siap huni di Perumahan Sunrise City Maros dengan bagi hasil profit hingga Rp 5 Jt per unit terbayar.',
        actionText: 'Masuk NARA Escrow Deal Room'
      },
      {
        id: 'need-05',
        title: 'Promo Jasa Arsitektur Hanya 6 Jt (Type 84)',
        badge: '📐 Special Design Offer',
        badgeColor: 'bg-blue-50 text-blue-800 border-blue-200',
        profitTag: 'Hanya Rp 6.000.000',
        location: 'Desain Online / Wilayah Indonesia',
        image: 'https://images.unsplash.com/photo-1600607687939-ce8a6c25118c?auto=format&fit=crop&w=800&q=80',
        description: 'Paket gambar kerja lengkap arsitek, struktur PBG/IMB, & render 3D visualisasi rumah mewah type 84 m² hanya seharga Rp 6 Juta.',
        actionText: 'Ambil Promo Arsitektur'
      }
    ];

    const DEFAULT_PARTNERS = [
      { id: 'btn', name: 'Bank BTN', label: 'Bank BTN', icon: '🏠', type: 'btn' },
      { id: 'mandiri', name: 'Bank Mandiri', label: 'Bank Mandiri', icon: '🏦', type: 'mandiri' },
      { id: 'bri', name: 'Bank BRI', label: 'Bank BRI', icon: '🏦', type: 'bri' },
      { id: 'bni', name: 'Bank BNI', label: 'Bank BNI', icon: '🏦', type: 'bni' },
      { id: 'sig', name: 'Semen Indonesia (SIG)', label: 'SIG', icon: '🏗️', type: 'sig' },
      { id: 'cks', name: 'PT. Catur Kencana Sakti', label: 'PT. Catur Kencana Sakti', icon: '🏢' },
      { id: 'ppat', name: 'Notaris PPAT', label: 'Notaris PPAT', icon: '📜' },
      { id: 'harapanjaya', name: 'PT. Harapan Jaya Brand', label: 'PT. Harapan Jaya Brand', icon: '🔨' },
      { id: 'kalla', name: 'Kalla Beton', label: 'Kalla Beton', icon: '🧱' }
    ];

    function AdminCMSApp() {
      const [isAuthenticated, setIsAuthenticated] = useState(false);
      const [passkey, setPasskey] = useState('');
      const [activeNav, setActiveNav] = useState('hero');
      const [toastMsg, setToastMsg] = useState('');

      // State Managed Configs
      const [heroConfig, setHeroConfig] = useState(DEFAULT_HERO);
      const [needsCardsList, setNeedsCardsList] = useState(DEFAULT_NEEDS);
      const [partnersList, setPartnersList] = useState(DEFAULT_PARTNERS);

      // Form State for Adding New Deal Card
      const [newCard, setNewCard] = useState({
        title: '',
        badge: '📊 Mini Investment',
        profitTag: 'Profit 20%',
        location: 'Makassar',
        image: 'https://images.unsplash.com/photo-1600585154340-be6161a56a0c?auto=format&fit=crop&w=800&q=80',
        description: '',
        actionText: 'Masuk NARA Escrow Deal Room'
      });

      // Form State for Adding New Partner
      const [newPartnerName, setNewPartnerName] = useState('');

      useEffect(() => {
        // Load saved CMS data from localStorage
        const savedData = localStorage.getItem('nara_cms_config');
        if (savedData) {
          try {
            const parsed = JSON.parse(savedData);
            if (parsed.heroConfig) setHeroConfig(parsed.heroConfig);
            if (parsed.needsCardsList) setNeedsCardsList(parsed.needsCardsList);
            if (parsed.partnersList) setPartnersList(parsed.partnersList);
          } catch(e) {
            console.error('Error parsing stored CMS data', e);
          }
        }
      }, []);

      const showToast = (msg) => {
        setToastMsg(msg);
        setTimeout(() => setToastMsg(''), 3000);
      };

      const handleLogin = (e) => {
        e.preventDefault();
        if (passkey === 'admin' || passkey === '123456' || passkey === 'nara') {
          setIsAuthenticated(true);
        } else {
          alert('🔑 Kata Sandi Admin Salah! (Petunjuk: Gunakan passkey "admin" atau "nara")');
        }
      };

      const handleSaveAllToLocalStorage = () => {
        const payload = {
          heroConfig,
          needsCardsList,
          partnersList,
          lastSaved: new Date().toISOString()
        };
        localStorage.setItem('nara_cms_config', JSON.stringify(payload));
        showToast('🚀 SUKSES! Seluruh Data CMS Berhasil Disimpan & Diterapkan ke Halaman Utama index.html!');
      };

      const handleResetDefaults = () => {
        if (confirm('⚠️ Apakah Anda yakin ingin mengembalikan semua data ke Pengaturan Awal (Default)?')) {
          setHeroConfig(DEFAULT_HERO);
          setNeedsCardsList(DEFAULT_NEEDS);
          setPartnersList(DEFAULT_PARTNERS);
          localStorage.removeItem('nara_cms_config');
          showToast('🔄 Pengaturan Berhasil Dikembalikan ke Default!');
        }
      };

      const handleAddCardSubmit = (e) => {
        e.preventDefault();
        if (!newCard.title) return;
        const item = {
          id: 'need-' + Date.now(),
          ...newCard,
          badgeColor: 'bg-teal-50 text-teal-800 border-teal-200'
        };
        setNeedsCardsList([item, ...needsCardsList]);
        setNewCard({
          title: '',
          badge: '📊 Mini Investment',
          profitTag: 'Profit 20%',
          location: 'Makassar',
          image: 'https://images.unsplash.com/photo-1600585154340-be6161a56a0c?auto=format&fit=crop&w=800&q=80',
          description: '',
          actionText: 'Masuk NARA Escrow Deal Room'
        });
        showToast('➕ Deal Card Baru Ditambahkan! Jangan lupa klik "Simpan ke Web".');
      };

      const handleDeleteCard = (id) => {
        setNeedsCardsList(needsCardsList.filter(c => c.id !== id));
        showToast('🗑️ Deal Card Dihapus!');
      };

      const handleAddPartnerSubmit = (e) => {
        e.preventDefault();
        if (!newPartnerName) return;
        const item = {
          id: 'partner-' + Date.now(),
          name: newPartnerName,
          label: newPartnerName,
          icon: '🤝'
        };
        setPartnersList([...partnersList, item]);
        setNewPartnerName('');
        showToast('➕ Partner Baru Ditambahkan!');
      };

      const handleDeletePartner = (id) => {
        setPartnersList(partnersList.filter(p => p.id !== id));
        showToast('🗑️ Partner Dihapus!');
      };

      // LOGIN SCREEN FOR CMS ADMIN
      if (!isAuthenticated) {
        return (
          <div className="min-h-screen flex items-center justify-center p-4 bg-slate-950 text-white">
            <div className="glass-card max-w-md w-full p-8 space-y-6 border border-slate-800 shadow-2xl">
              <div className="text-center space-y-2">
                <div className="w-14 h-14 rounded-2xl bg-[#1ac1b9] text-slate-950 font-black text-2xl mx-auto flex items-center justify-center shadow-lg">
                  N
                </div>
                <h1 className="text-2xl font-black text-white tracking-tight">NaraEcosystem® CMS</h1>
                <p className="text-xs text-slate-400">Portal Admin Terpisah (Enterprise Industrial Architecture)</p>
              </div>

              <form onSubmit={handleLogin} className="space-y-4 text-xs">
                <div>
                  <label className="font-extrabold text-slate-300 block mb-1">Passkey Autentikasi Admin:</label>
                  <input 
                    type="password" 
                    required
                    placeholder="Masukkan sandi admin (contoh: admin)"
                    value={passkey}
                    onChange={(e) => setPasskey(e.target.value)}
                    className="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-[#1ac1b9]"
                  />
                </div>

                <button 
                  type="submit"
                  className="w-full py-3 bg-[#1ac1b9] hover:bg-[#16a39d] text-slate-950 font-black text-xs rounded-xl shadow-lg transition-all cursor-pointer"
                >
                  🔑 Masuk Portal CMS Admin
                </button>
              </form>

              <div className="text-center pt-2">
                <a href="./index.html" className="text-xs text-slate-400 hover:text-[#1ac1b9] underline">
                  ← Kembali ke Halaman Utama Web (index.html)
                </a>
              </div>
            </div>
          </div>
        );
      }

      // MAIN CMS DASHBOARD
      return (
        <div className="min-h-screen flex flex-col justify-between bg-slate-950 text-slate-100 font-sans">
          
          {/* HEADER BAR CMS */}
          <header className="bg-slate-900 border-b border-slate-800 sticky top-0 z-50">
            <div className="max-w-7xl mx-auto px-6 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
              
              <div className="flex items-center gap-3">
                <img src="./nara-logo.png" alt="NaraEcosystem Logo" className="h-9 w-auto object-contain" />
                <div>
                  <h1 className="text-base font-black text-white flex items-center gap-2">
                    <span>NaraEcosystem® Content Management System</span>
                    <span className="bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 text-[10px] font-black px-2 py-0.5 rounded-full">
                      STANDALONE ADMIN PORTAL
                    </span>
                  </h1>
                  <p className="text-xs text-slate-400">Arsitektur Industri Terpisah — Mengontrol Konten Halaman index.html</p>
                </div>
              </div>

              <div className="flex items-center gap-3">
                <a 
                  href="./index.html" 
                  target="_blank"
                  className="px-3.5 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-bold rounded-xl border border-slate-700 transition-all flex items-center gap-1.5"
                >
                  <span>🌐 Lihat Web Utama</span>
                  <span className="text-[10px] text-teal-400">(index.html)</span>
                </a>

                <button 
                  onClick={handleSaveAllToLocalStorage}
                  className="px-4 py-2 bg-[#1ac1b9] hover:bg-[#16a39d] text-slate-950 font-black text-xs rounded-xl shadow-lg transition-all cursor-pointer flex items-center gap-1.5"
                >
                  <span>💾 Simpan Perubahan Ke Web</span>
                </button>
              </div>

            </div>
          </header>

          {/* TOAST ALERTS */}
          {toastMsg && (
            <div className="bg-[#1ac1b9] text-slate-950 font-black text-xs py-2.5 px-4 text-center shadow-lg transition-all animate-bounce">
              {toastMsg}
            </div>
          )}

          {/* CMS MAIN CONTAINER */}
          <main className="max-w-7xl mx-auto px-6 py-8 space-y-6 flex-1 w-full">
            
            {/* CMS NAVIGATION TABS */}
            <div className="flex flex-wrap gap-3 border-b border-slate-800 pb-4">
              <button 
                onClick={() => setActiveNav('hero')}
                className={`px-5 py-2.5 rounded-xl font-black text-xs transition-all cursor-pointer ${activeNav === 'hero' ? 'bg-[#1ac1b9] text-slate-950 shadow-md' : 'bg-slate-900 text-slate-400 hover:text-white border border-slate-800'}`}
              >
                🎨 1. Banner Hero & Tema Warna
              </button>
              <button 
                onClick={() => setActiveNav('deals')}
                className={`px-5 py-2.5 rounded-xl font-black text-xs transition-all cursor-pointer ${activeNav === 'deals' ? 'bg-[#1ac1b9] text-slate-950 shadow-md' : 'bg-slate-900 text-slate-400 hover:text-white border border-slate-800'}`}
              >
                📢 2. Promosi & Proposal Cards ({needsCardsList.length})
              </button>
              <button 
                onClick={() => setActiveNav('partners')}
                className={`px-5 py-2.5 rounded-xl font-black text-xs transition-all cursor-pointer ${activeNav === 'partners' ? 'bg-[#1ac1b9] text-slate-950 shadow-md' : 'bg-slate-900 text-slate-400 hover:text-white border border-slate-800'}`}
              >
                🤝 3. Logo Mitra Running Marquee ({partnersList.length})
              </button>
              <button 
                onClick={handleResetDefaults}
                className="px-4 py-2.5 rounded-xl font-bold text-xs bg-rose-950/60 hover:bg-rose-900 text-rose-300 border border-rose-800/50 transition-all cursor-pointer ml-auto"
              >
                🔄 Reset Default
              </button>
            </div>

            {/* TAB 1: HERO CONFIG */}
            {activeNav === 'hero' && (
              <div className="space-y-6">
                <div className="glass-card p-6 space-y-4">
                  <h2 className="text-sm font-extrabold text-teal-400 uppercase tracking-wider border-b border-slate-800 pb-3">
                    ✏️ Pengaturan Teks Banner Utama (Hero Section)
                  </h2>

                  <div className="space-y-4 text-xs">
                    <div>
                      <label className="font-bold text-slate-300 block mb-1">Judul Utama (Baris Pertama):</label>
                      <input 
                        type="text" 
                        value={heroConfig.headingPre}
                        onChange={(e) => setHeroConfig({...heroConfig, headingPre: e.target.value})}
                        className="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-white font-bold text-sm"
                      />
                    </div>

                    <div>
                      <label className="font-bold text-slate-300 block mb-1">Teks Sorotan (Warna Kuning Highlight):</label>
                      <input 
                        type="text" 
                        value={heroConfig.headingHighlight}
                        onChange={(e) => setHeroConfig({...heroConfig, headingHighlight: e.target.value})}
                        className="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-amber-400 font-bold text-sm"
                      />
                    </div>

                    <div>
                      <label className="font-bold text-slate-300 block mb-1">Deskripsi Pembuka Platform:</label>
                      <textarea 
                        rows="3"
                        value={heroConfig.description}
                        onChange={(e) => setHeroConfig({...heroConfig, description: e.target.value})}
                        className="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-slate-200"
                      ></textarea>
                    </div>
                  </div>
                </div>

                {/* THEME PRESETS */}
                <div className="glass-card p-6 space-y-4">
                  <h2 className="text-sm font-extrabold text-teal-400 uppercase tracking-wider border-b border-slate-800 pb-3">
                    🎨 Pilihan Palet Gradasi Banner Utama
                  </h2>

                  <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 text-xs">
                    <button 
                      onClick={() => setHeroConfig({...heroConfig, gradientBg: 'from-[#0f4c4a] via-[#136663] to-[#0d7873]'})}
                      className={`p-4 rounded-2xl border text-left bg-gradient-to-r from-[#0f4c4a] via-[#136663] to-[#0d7873] text-white cursor-pointer ${heroConfig.gradientBg.includes('#0f4c4a') ? 'ring-2 ring-amber-400 border-white shadow-xl' : 'border-slate-700'}`}
                    >
                      <span className="font-black text-sm block">Teal Beams (#1AC1B9)</span>
                      <span className="text-teal-200 text-[11px]">Tema Bawaan NARA Ecosystem</span>
                    </button>

                    <button 
                      onClick={() => setHeroConfig({...heroConfig, gradientBg: 'from-[#1e3a8a] via-[#1d4ed8] to-[#1e40af]'})}
                      className={`p-4 rounded-2xl border text-left bg-gradient-to-r from-[#1e3a8a] via-[#1d4ed8] to-[#1e40af] text-white cursor-pointer ${heroConfig.gradientBg.includes('#1e3a8a') ? 'ring-2 ring-amber-400 border-white shadow-xl' : 'border-slate-700'}`}
                    >
                      <span className="font-black text-sm block">Royal Navy Blue</span>
                      <span className="text-blue-200 text-[11px]">Corporate & Institutional</span>
                    </button>

                    <button 
                      onClick={() => setHeroConfig({...heroConfig, gradientBg: 'from-[#064e3b] via-[#047857] to-[#059669]'})}
                      className={`p-4 rounded-2xl border text-left bg-gradient-to-r from-[#064e3b] via-[#047857] to-[#059669] text-white cursor-pointer ${heroConfig.gradientBg.includes('#064e3b') ? 'ring-2 ring-amber-400 border-white shadow-xl' : 'border-slate-700'}`}
                    >
                      <span className="font-black text-sm block">Emerald Green</span>
                      <span className="text-emerald-200 text-[11px]">Eco-living & Sustainable</span>
                    </button>

                    <button 
                      onClick={() => setHeroConfig({...heroConfig, gradientBg: 'from-[#78350f] via-[#b45309] to-[#d97706]'})}
                      className={`p-4 rounded-2xl border text-left bg-gradient-to-r from-[#78350f] via-[#b45309] to-[#d97706] text-white cursor-pointer ${heroConfig.gradientBg.includes('#78350f') ? 'ring-2 ring-amber-400 border-white shadow-xl' : 'border-slate-700'}`}
                    >
                      <span className="font-black text-sm block">Luxury Gold</span>
                      <span className="text-amber-200 text-[11px]">Exclusive Premium Investment</span>
                    </button>
                  </div>
                </div>
              </div>
            )}

            {/* TAB 2: DEALS CARDS */}
            {activeNav === 'deals' && (
              <div className="space-y-6">
                
                {/* Form Tambah Deal Baru */}
                <form onSubmit={handleAddCardSubmit} className="glass-card p-6 space-y-4 border border-teal-500/30">
                  <h2 className="text-sm font-extrabold text-teal-400 uppercase tracking-wider border-b border-slate-800 pb-3 flex items-center gap-2">
                    <span>➕ Tambah Card Promosi / Proposal Baru</span>
                  </h2>

                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4 text-xs">
                    <div>
                      <label className="font-bold text-slate-300 block mb-1">Judul Penawaran:</label>
                      <input 
                        type="text" 
                        required
                        placeholder="Contoh: Proposal Investasi Ruko Hook Profit 30%"
                        value={newCard.title}
                        onChange={(e) => setNewCard({...newCard, title: e.target.value})}
                        className="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-white"
                      />
                    </div>

                    <div>
                      <label className="font-bold text-slate-300 block mb-1">Badge Category (Misal: 💎 Mini Investment):</label>
                      <input 
                        type="text" 
                        required
                        value={newCard.badge}
                        onChange={(e) => setNewCard({...newCard, badge: e.target.value})}
                        className="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-white"
                      />
                    </div>

                    <div>
                      <label className="font-bold text-slate-300 block mb-1">Profit / Price Tag (Misal: Profit 25% p.a.):</label>
                      <input 
                        type="text" 
                        required
                        value={newCard.profitTag}
                        onChange={(e) => setNewCard({...newCard, profitTag: e.target.value})}
                        className="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-amber-400 font-bold"
                      />
                    </div>

                    <div>
                      <label className="font-bold text-slate-300 block mb-1">Lokasi:</label>
                      <input 
                        type="text" 
                        required
                        value={newCard.location}
                        onChange={(e) => setNewCard({...newCard, location: e.target.value})}
                        className="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-white"
                      />
                    </div>
                  </div>

                  <div className="text-xs">
                    <label className="font-bold text-slate-300 block mb-1">URL Gambar Header Card:</label>
                    <input 
                      type="text" 
                      required
                      value={newCard.image}
                      onChange={(e) => setNewCard({...newCard, image: e.target.value})}
                      className="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-slate-300 font-mono"
                    />
                  </div>

                  <div className="text-xs">
                    <label className="font-bold text-slate-300 block mb-1">Deskripsi Ringkas Penawaran:</label>
                    <textarea 
                      rows="2"
                      required
                      placeholder="Jelaskan detail skema keuntungan atau garansi NARA Escrow..."
                      value={newCard.description}
                      onChange={(e) => setNewCard({...newCard, description: e.target.value})}
                      className="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-white"
                    ></textarea>
                  </div>

                  <button 
                    type="submit"
                    className="px-6 py-3 bg-[#1ac1b9] hover:bg-[#16a39d] text-slate-950 font-black text-xs rounded-xl shadow-lg cursor-pointer transition-all"
                  >
                    ➕ Tambahkan Card Ke Draf CMS
                  </button>
                </form>

                {/* List Cards */}
                <div className="glass-card p-6 space-y-4">
                  <h2 className="text-sm font-extrabold text-teal-400 uppercase tracking-wider border-b border-slate-800 pb-3">
                    📋 Daftar Cards Promo Aktif ({needsCardsList.length} Cards)
                  </h2>

                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4 text-xs">
                    {needsCardsList.map(c => (
                      <div key={c.id} className="bg-slate-900 p-4 rounded-2xl border border-slate-800 space-y-3 flex flex-col justify-between">
                        <div className="flex gap-3">
                          <img src={c.image} className="w-16 h-16 rounded-xl object-cover border border-slate-700 shrink-0" />
                          <div>
                            <span className="text-[10px] font-bold text-amber-400 block">{c.profitTag}</span>
                            <h3 className="font-bold text-white text-sm leading-snug">{c.title}</h3>
                            <p className="text-[11px] text-slate-400">📍 {c.location}</p>
                          </div>
                        </div>

                        <div className="pt-2 border-t border-slate-800 flex justify-between items-center">
                          <span className="text-[10px] text-teal-400 font-mono">{c.badge}</span>
                          <button 
                            type="button"
                            onClick={() => handleDeleteCard(c.id)}
                            className="px-3 py-1 bg-rose-950 hover:bg-rose-900 text-rose-300 font-bold text-xs rounded-lg border border-rose-800 cursor-pointer"
                          >
                            🗑️ Hapus Card
                          </button>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>

              </div>
            )}

            {/* TAB 3: PARTNERS LOGO */}
            {activeNav === 'partners' && (
              <div className="space-y-6">
                
                {/* Form Tambah Partner */}
                <form onSubmit={handleAddPartnerSubmit} className="glass-card p-6 space-y-4 border border-teal-500/30">
                  <h2 className="text-sm font-extrabold text-teal-400 uppercase tracking-wider border-b border-slate-800 pb-3 flex items-center gap-2">
                    <span>🤝 Tambah Mitra / Logo Baru Ke Marquee Slider</span>
                  </h2>

                  <div className="flex gap-3 text-xs">
                    <input 
                      type="text" 
                      required
                      placeholder="Masukkan nama mitra/perusahaan baru..."
                      value={newPartnerName}
                      onChange={(e) => setNewPartnerName(e.target.value)}
                      className="flex-1 bg-slate-900 border border-slate-700 rounded-xl p-3 text-white"
                    />

                    <button 
                      type="submit"
                      className="px-6 py-3 bg-[#1ac1b9] hover:bg-[#16a39d] text-slate-950 font-black text-xs rounded-xl shadow-lg cursor-pointer transition-all"
                    >
                      ➕ Tambahkan
                    </button>
                  </div>
                </form>

                {/* List Partners */}
                <div className="glass-card p-6 space-y-4">
                  <h2 className="text-sm font-extrabold text-teal-400 uppercase tracking-wider border-b border-slate-800 pb-3">
                    📋 Daftar Mitra Running Marquee ({partnersList.length} Partners)
                  </h2>

                  <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3 text-xs">
                    {partnersList.map(p => (
                      <div key={p.id} className="bg-slate-900 p-3.5 rounded-xl border border-slate-800 flex justify-between items-center">
                        <div className="flex items-center gap-2">
                          <span className="text-lg">{p.icon || '🤝'}</span>
                          <span className="font-extrabold text-white">{p.name}</span>
                        </div>

                        <button 
                          type="button"
                          onClick={() => handleDeletePartner(p.id)}
                          className="px-2.5 py-1 bg-rose-950 hover:bg-rose-900 text-rose-300 font-bold text-[11px] rounded-lg border border-rose-800 cursor-pointer"
                        >
                          🗑️ Hapus
                        </button>
                      </div>
                    ))}
                  </div>
                </div>

              </div>
            )}

          </main>

          {/* FOOTER BAR */}
          <footer className="bg-slate-900 border-t border-slate-800 py-4 text-center text-xs text-slate-500">
            © 2026 NaraEcosystem® Standalone CMS Admin Portal. All Changes Sync to index.html via LocalStorage.
          </footer>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<AdminCMSApp />);
  </script>
</body>
</html>
