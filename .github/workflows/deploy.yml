name: Auto Deploy to VPS (CI/CD)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to NARA VPS Server
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Instant Webhook Deploy on VPS
        run: |
          echo "🚀 Triggering NARA Ecosystem Auto-Deployment on VPS..."
          RESPONSE=$(curl -s -X POST "http://103.93.135.68/api/v1/deploy-webhook")
          echo "Server Response: $RESPONSE"
          echo "✅ Auto-Deployment Successfully Triggered on VPS!"
