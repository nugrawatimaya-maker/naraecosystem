<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NARA Ecosystem — CMS Admin Portal & Content Management System</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Plus Jakarta Sans', 'sans-serif'],
            mono: ['IBM Plex Mono', 'monospace'],
          },
          colors: {
            naraTeal: '#1ac1b9',
            naraDark: '#0f172a',
            naraGold: '#f59e0b',
            naraEmerald: '#064e3b'
          }
        }
      }
    }
  </script>

  <!-- Custom Styles for Dark & Light Themes -->
  <style>
    body {
      margin: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    /* THEME: DARK (Default) */
    body.theme-dark {
      background-color: #0f172a;
      color: #f8fafc;
    }
    body.theme-dark .admin-card {
      background: rgba(30, 41, 59, 0.75);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
    }
    body.theme-dark .admin-header {
      background: rgba(15, 23, 42, 0.95);
      border-bottom: 1px solid #1e293b;
    }
    body.theme-dark .admin-input {
      background: #0f172a;
      border: 1px solid #334155;
      color: #ffffff;
    }
    body.theme-dark .admin-input:focus {
      border-color: #1ac1b9;
      background: #1e293b;
    }
    body.theme-dark .admin-subcard {
      background: #0f172a;
      border: 1px solid #1e293b;
    }

    /* THEME: LIGHT (Clean Professional) */
    body.theme-light {
      background-color: #f1f5f9;
      color: #0f172a;
    }
    body.theme-light .admin-card {
      background: #ffffff;
      border: 1px solid #cbd5e1;
      box-shadow: 0 10px 30px -8px rgba(15, 23, 42, 0.08);
    }
    body.theme-light .admin-header {
      background: #ffffff;
      border-bottom: 1px solid #cbd5e1;
    }
    body.theme-light .admin-input {
      background: #f8fafc;
      border: 1px solid #cbd5e1;
      color: #0f172a;
    }
    body.theme-light .admin-input:focus {
      border-color: #0d9488;
      background: #ffffff;
    }
    body.theme-light .admin-subcard {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
    }

    /* THEME: EMERALD (Luxury Eco) */
    body.theme-emerald {
      background-color: #022c22;
      color: #ecfdf5;
    }
    body.theme-emerald .admin-card {
      background: rgba(6, 78, 59, 0.7);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(52, 211, 153, 0.2);
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
    }
    body.theme-emerald .admin-header {
      background: rgba(6, 78, 59, 0.95);
      border-bottom: 1px solid rgba(52, 211, 153, 0.2);
    }
    body.theme-emerald .admin-input {
      background: #022c22;
      border: 1px solid rgba(52, 211, 153, 0.3);
      color: #ffffff;
    }
    body.theme-emerald .admin-input:focus {
      border-color: #f59e0b;
      background: #064e3b;
    }
    body.theme-emerald .admin-subcard {
      background: #022c22;
      border: 1px solid rgba(52, 211, 153, 0.2);
    }

    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #64748b; border-radius: 4px; }
  </style>

  <!-- React 18, ReactDOM 18, Babel -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="theme-dark">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const DEFAULT_HERO = {
      headingPre: 'Terhubung dengan mitra yang tepat,',
      headingHighlight: 'capai kesepakatan yang menguntungkan.',
      description: 'NARA Ecosystem mempertemukan investor, pemilik lahan, kontraktor, toko bangunan, notaris, dan masyarakat umum dalam satu platform bergaransi Rekening Escrow.',
      gradientBg: 'from-[#064e3b] via-[#047857] to-[#022c22]'
    };

    const DEFAULT_NEEDS = [
      {
        id: 'need-01',
        title: 'Proposal Bisnis Investasi Properti (Profit 25%)',
        badge: '📊 Joint Venture Investment',
        badgeColor: 'bg-teal-50 text-teal-800 border-teal-200',
        profitTag: 'Profit 25% p.a.',
        location: 'Makassar & Maros, Sulawesi Selatan',
        image: 'https://images.unsplash.com/photo-1600585154340-be6161a56a0c?auto=format&fit=crop&w=800&q=80',
        description: 'Proposal kerjasama investasi pengembangan lahan & cluster perumahan komersial dengan skema bagi hasil terjamin via NARA Escrow.',
        actionText: 'Masuk NARA Escrow Deal Room'
      },
      {
        id: 'need-02',
        title: 'Mini Investasi Pengembangan Blok Perumahan',
        badge: '💎 Mini Investment',
        badgeColor: 'bg-amber-50 text-amber-800 border-amber-200',
        profitTag: 'Profit 20% / 6 Bulan',
        location: 'Kawasan Strategis Maros & BSD',
        image: 'https://images.unsplash.com/photo-1580587771525-78b9dba3b914?auto=format&fit=crop&w=800&q=80',
        description: 'Peluang dana investasi mini blok hunian siap bangun dengan penjaminan unit sertifikat & legalitas SHM terlindungi.',
        actionText: 'Masuk NARA Escrow Deal Room'
      },
      {
        id: 'need-03',
        title: 'Promo Jasa Agen Marketing (Diskon 50%)',
        badge: '📢 Marketing Special Promo',
        badgeColor: 'bg-[#1ac1b9]/10 text-[#0d9488] border-[#1ac1b9]/30',
        profitTag: 'Diskon Komisi 50%',
        location: 'Nasional / Seluruh Indonesia',
        image: 'https://images.unsplash.com/photo-1551836022-d5d88e9218df?auto=format&fit=crop&w=800&q=80',
        description: 'Layanan agen pemasaran & broker properti profesional NARA dengan potongan komisi penanganan 50% dan garansi listing tayang cepat.',
        actionText: 'Ambil Promo Marketing'
      },
      {
        id: 'need-04',
        title: '5 Unit Kerjasama Perumahan Sunrise City Maros',
        badge: '🏡 Developer Special Project',
        badgeColor: 'bg-emerald-50 text-emerald-800 border-emerald-200',
        profitTag: 'Profit Hingga Rp 5 Jt / Unit',
        location: 'Sunrise City Maros, Sulawesi Selatan',
        image: 'https://images.unsplash.com/photo-1512917774080-9991f1c4c750?auto=format&fit=crop&w=800&q=80',
        description: 'Kerjasama eksklusif 5 unit hunian siap huni di Perumahan Sunrise City Maros dengan bagi hasil profit hingga Rp 5 Jt per unit terbayar.',
        actionText: 'Masuk NARA Escrow Deal Room'
      },
      {
        id: 'need-05',
        title: 'Promo Jasa Arsitektur Hanya 6 Jt (Type 84)',
        badge: '📐 Special Design Offer',
        badgeColor: 'bg-blue-50 text-blue-800 border-blue-200',
        profitTag: 'Hanya Rp 6.000.000',
        location: 'Desain Online / Wilayah Indonesia',
        image: 'https://images.unsplash.com/photo-1600607687939-ce8a6c25118c?auto=format&fit=crop&w=800&q=80',
        description: 'Paket gambar kerja lengkap arsitek, struktur PBG/IMB, & render 3D visualisasi rumah mewah type 84 m² hanya seharga Rp 6 Juta.',
        actionText: 'Ambil Promo Arsitektur'
      }
    ];

    const DEFAULT_PARTNERS = [
      { id: 'btn', name: 'Bank BTN', label: 'Bank BTN', icon: '🏠', type: 'btn' },
      { id: 'mandiri', name: 'Bank Mandiri', label: 'Bank Mandiri', icon: '🏦', type: 'mandiri' },
      { id: 'bri', name: 'Bank BRI', label: 'Bank BRI', icon: '🏦', type: 'bri' },
      { id: 'bni', name: 'Bank BNI', label: 'Bank BNI', icon: '🏦', type: 'bni' },
      { id: 'sig', name: 'Semen Indonesia (SIG)', label: 'SIG', icon: '🏗️', type: 'sig' },
      { id: 'cks', name: 'PT. Catur Kencana Sakti', label: 'PT. Catur Kencana Sakti', icon: '🏢' },
      { id: 'ppat', name: 'Notaris PPAT', label: 'Notaris PPAT', icon: '📜' },
      { id: 'harapanjaya', name: 'PT. Harapan Jaya Brand', label: 'PT. Harapan Jaya Brand', icon: '🔨' },
      { id: 'kalla', name: 'Kalla Beton', label: 'Kalla Beton', icon: '🧱' }
    ];

    function AdminCMSApp() {
      const [isAuthenticated, setIsAuthenticated] = useState(false);
      const [passkey, setPasskey] = useState('');
      const [activeNav, setActiveNav] = useState('hero'); // 'hero', 'deals', 'partners', 'theme', 'about'
      const [toastMsg, setToastMsg] = useState('');

      // Admin Theme State: 'dark', 'light', 'emerald'
      const [adminTheme, setAdminTheme] = useState('dark');

      // State Managed Configs
      const [heroConfig, setHeroConfig] = useState(DEFAULT_HERO);
      const [needsCardsList, setNeedsCardsList] = useState(DEFAULT_NEEDS);
      const [partnersList, setPartnersList] = useState(DEFAULT_PARTNERS);

      // Form State for Adding New Deal Card
      const [newCard, setNewCard] = useState({
        title: '',
        badge: '📊 Mini Investment',
        profitTag: 'Profit 20%',
        location: 'Makassar',
        image: 'https://images.unsplash.com/photo-1600585154340-be6161a56a0c?auto=format&fit=crop&w=800&q=80',
        description: '',
        actionText: 'Masuk NARA Escrow Deal Room'
      });

      // Form State for Adding New Partner
      const [newPartnerName, setNewPartnerName] = useState('');

      useEffect(() => {
        // Load stored theme
        const savedTheme = localStorage.getItem('nara_admin_theme') || 'dark';
        setAdminTheme(savedTheme);
        document.body.className = `theme-${savedTheme}`;

        // Load saved CMS data from localStorage
        const savedData = localStorage.getItem('nara_cms_config');
        if (savedData) {
          try {
            const parsed = JSON.parse(savedData);
            if (parsed.heroConfig) setHeroConfig(parsed.heroConfig);
            if (parsed.needsCardsList) setNeedsCardsList(parsed.needsCardsList);
            if (parsed.partnersList) setPartnersList(parsed.partnersList);
          } catch(e) {
            console.error('Error parsing stored CMS data', e);
          }
        }
      }, []);

      const changeTheme = (newTheme) => {
        setAdminTheme(newTheme);
        document.body.className = `theme-${newTheme}`;
        localStorage.setItem('nara_admin_theme', newTheme);
        showToast(`🎨 Tema Admin diubah ke Mode ${newTheme.toUpperCase()}!`);
      };

      const showToast = (msg) => {
        setToastMsg(msg);
        setTimeout(() => setToastMsg(''), 3000);
      };

      const handleLogin = (e) => {
        e.preventDefault();
        if (passkey === 'admin' || passkey === '123456' || passkey === 'nara') {
          setIsAuthenticated(true);
        } else {
          alert('🔑 Kata Sandi Admin Salah! (Petunjuk: Gunakan passkey "admin" atau "nara")');
        }
      };

      const handleSaveAllToLocalStorage = () => {
        const payload = {
          heroConfig,
          needsCardsList,
          partnersList,
          lastSaved: new Date().toISOString()
        };
        localStorage.setItem('nara_cms_config', JSON.stringify(payload));
        showToast('🚀 SUKSES! Seluruh Data CMS Berhasil Disimpan & Diterapkan ke Halaman Utama index.html!');
      };

      const handleResetDefaults = () => {
        if (confirm('⚠️ Apakah Anda yakin ingin mengembalikan semua data ke Pengaturan Awal (Default)?')) {
          setHeroConfig(DEFAULT_HERO);
          setNeedsCardsList(DEFAULT_NEEDS);
          setPartnersList(DEFAULT_PARTNERS);
          localStorage.removeItem('nara_cms_config');
          showToast('🔄 Pengaturan Berhasil Dikembalikan ke Default!');
        }
      };

      const handleAddCardSubmit = (e) => {
        e.preventDefault();
        if (!newCard.title) return;
        const item = {
          id: 'need-' + Date.now(),
          ...newCard,
          badgeColor: 'bg-teal-50 text-teal-800 border-teal-200'
        };
        setNeedsCardsList([item, ...needsCardsList]);
        setNewCard({
          title: '',
          badge: '📊 Mini Investment',
          profitTag: 'Profit 20%',
          location: 'Makassar',
          image: 'https://images.unsplash.com/photo-1600585154340-be6161a56a0c?auto=format&fit=crop&w=800&q=80',
          description: '',
          actionText: 'Masuk NARA Escrow Deal Room'
        });
        showToast('➕ Deal Card Baru Ditambahkan! Jangan lupa klik "Simpan ke Web".');
      };

      const handleDeleteCard = (id) => {
        setNeedsCardsList(needsCardsList.filter(c => c.id !== id));
        showToast('🗑️ Deal Card Dihapus!');
      };

      const handleAddPartnerSubmit = (e) => {
        e.preventDefault();
        if (!newPartnerName) return;
        const item = {
          id: 'partner-' + Date.now(),
          name: newPartnerName,
          label: newPartnerName,
          icon: '🤝'
        };
        setPartnersList([...partnersList, item]);
        setNewPartnerName('');
        showToast('➕ Partner Baru Ditambahkan!');
      };

      const handleDeletePartner = (id) => {
        setPartnersList(partnersList.filter(p => p.id !== id));
        showToast('🗑️ Partner Dihapus!');
      };

      // LOGIN SCREEN FOR CMS ADMIN
      if (!isAuthenticated) {
        return (
          <div className="min-h-screen flex items-center justify-center p-4">
            <div className="admin-card max-w-md w-full p-8 space-y-6 rounded-3xl">
              <div className="text-center space-y-2">
                <div className="w-14 h-14 rounded-2xl bg-[#1ac1b9] text-slate-950 font-black text-2xl mx-auto flex items-center justify-center shadow-lg">
                  N
                </div>
                <h1 className="text-2xl font-black tracking-tight">NaraEcosystem® CMS</h1>
                <p className="text-xs opacity-75">Portal Admin Pengelolaan Konten & Tata Letak Web</p>
              </div>

              {/* Theme Switcher in Login Screen */}
              <div className="flex justify-center gap-2 p-1.5 rounded-2xl admin-subcard text-xs font-bold">
                <button 
                  type="button" 
                  onClick={() => changeTheme('dark')}
                  className={`px-3 py-1.5 rounded-xl transition-all ${adminTheme === 'dark' ? 'bg-[#1ac1b9] text-slate-950' : 'opacity-70'}`}
                >
                  🌙 Gelap
                </button>
                <button 
                  type="button" 
                  onClick={() => changeTheme('light')}
                  className={`px-3 py-1.5 rounded-xl transition-all ${adminTheme === 'light' ? 'bg-[#1ac1b9] text-slate-950' : 'opacity-70'}`}
                >
                  ☀️ Terang
                </button>
                <button 
                  type="button" 
                  onClick={() => changeTheme('emerald')}
                  className={`px-3 py-1.5 rounded-xl transition-all ${adminTheme === 'emerald' ? 'bg-[#1ac1b9] text-slate-950' : 'opacity-70'}`}
                >
                  🌲 Emerald
                </button>
              </div>

              <form onSubmit={handleLogin} className="space-y-4 text-xs">
                <div>
                  <label className="font-extrabold block mb-1">Passkey Autentikasi Admin:</label>
                  <input 
                    type="password" 
                    required
                    placeholder="Masukkan sandi admin (contoh: admin / nara)"
                    value={passkey}
                    onChange={(e) => setPasskey(e.target.value)}
                    className="w-full admin-input rounded-xl p-3 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-[#1ac1b9]"
                  />
                </div>

                <button 
                  type="submit"
                  className="w-full py-3 bg-[#1ac1b9] hover:bg-[#16a39d] text-slate-950 font-black text-xs rounded-xl shadow-lg transition-all cursor-pointer"
                >
                  🔑 Masuk Portal CMS Admin
                </button>
              </form>

              <div className="text-center pt-2">
                <a href="./index.html" className="text-xs opacity-75 hover:opacity-100 hover:text-[#1ac1b9] underline">
                  ← Kembali ke Halaman Utama Web (index.html)
                </a>
              </div>
            </div>
          </div>
        );
      }

      // MAIN CMS DASHBOARD
      return (
        <div className="min-h-screen flex flex-col justify-between font-sans">
          
          {/* HEADER BAR CMS */}
          <header className="admin-header sticky top-0 z-50 transition-colors">
            <div className="max-w-7xl mx-auto px-6 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
              
              <div className="flex items-center gap-3">
                <img src="./nara-logo.png" alt="NaraEcosystem Logo" className="h-9 w-auto object-contain" />
                <div>
                  <h1 className="text-base font-black flex items-center gap-2">
                    <span>NaraEcosystem® Content Management System</span>
                    <span className="bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 text-[10px] font-black px-2 py-0.5 rounded-full">
                      STANDALONE ADMIN
                    </span>
                  </h1>
                  <p className="text-xs opacity-75">Kontrol Konten Halaman index.html & tentang.html</p>
                </div>
              </div>

              {/* ACTION BUTTONS & THEME TOGGLE */}
              <div className="flex items-center gap-3">
                
                {/* QUICK THEME SWITCHER TOGGLE */}
                <div className="flex items-center gap-1 p-1 rounded-xl admin-subcard text-xs font-bold">
                  <button 
                    onClick={() => changeTheme('dark')}
                    className={`p-1.5 px-2.5 rounded-lg transition-all ${adminTheme === 'dark' ? 'bg-[#1ac1b9] text-slate-950 shadow-sm' : 'opacity-60 hover:opacity-100'}`}
                    title="Tema Mode Gelap"
                  >
                    🌙 Gelap
                  </button>
                  <button 
                    onClick={() => changeTheme('light')}
                    className={`p-1.5 px-2.5 rounded-lg transition-all ${adminTheme === 'light' ? 'bg-[#1ac1b9] text-slate-950 shadow-sm' : 'opacity-60 hover:opacity-100'}`}
                    title="Tema Mode Terang"
                  >
                    ☀️ Terang
                  </button>
                  <button 
                    onClick={() => changeTheme('emerald')}
                    className={`p-1.5 px-2.5 rounded-lg transition-all ${adminTheme === 'emerald' ? 'bg-[#1ac1b9] text-slate-950 shadow-sm' : 'opacity-60 hover:opacity-100'}`}
                    title="Tema Mode Emerald Luxury"
                  >
                    🌲 Emerald
                  </button>
                </div>

                <a 
                  href="./index.html" 
                  target="_blank"
                  className="px-3.5 py-2 admin-subcard hover:opacity-90 text-xs font-bold rounded-xl transition-all flex items-center gap-1.5"
                >
                  <span>🌐 Web Utama</span>
                </a>

                <a 
                  href="./tentang.html" 
                  target="_blank"
                  className="px-3.5 py-2 admin-subcard hover:opacity-90 text-xs font-bold rounded-xl transition-all flex items-center gap-1.5"
                >
                  <span>📖 Tentang NARA</span>
                </a>

                <button 
                  onClick={handleSaveAllToLocalStorage}
                  className="px-4 py-2 bg-[#1ac1b9] hover:bg-[#16a39d] text-slate-950 font-black text-xs rounded-xl shadow-lg transition-all cursor-pointer flex items-center gap-1.5"
                >
                  <span>💾 Simpan Ke Web</span>
                </button>
              </div>

            </div>
          </header>

          {/* TOAST ALERTS */}
          {toastMsg && (
            <div className="bg-[#1ac1b9] text-slate-950 font-black text-xs py-2.5 px-4 text-center shadow-lg transition-all">
              {toastMsg}
            </div>
          )}

          {/* CMS MAIN CONTAINER */}
          <main className="max-w-7xl mx-auto px-6 py-8 space-y-6 flex-1 w-full">
            
            {/* CMS NAVIGATION TABS */}
            <div className="flex flex-wrap gap-2.5 border-b border-slate-700/50 pb-4">
              <button 
                onClick={() => setActiveNav('hero')}
                className={`px-4 py-2.5 rounded-xl font-black text-xs transition-all cursor-pointer ${activeNav === 'hero' ? 'bg-[#1ac1b9] text-slate-950 shadow-md' : 'admin-subcard opacity-70 hover:opacity-100'}`}
              >
                🎨 1. Banner Hero & Tema Warna
              </button>
              <button 
                onClick={() => setActiveNav('deals')}
                className={`px-4 py-2.5 rounded-xl font-black text-xs transition-all cursor-pointer ${activeNav === 'deals' ? 'bg-[#1ac1b9] text-slate-950 shadow-md' : 'admin-subcard opacity-70 hover:opacity-100'}`}
              >
                📢 2. Promosi & Proposal Cards ({needsCardsList.length})
              </button>
              <button 
                onClick={() => setActiveNav('partners')}
                className={`px-4 py-2.5 rounded-xl font-black text-xs transition-all cursor-pointer ${activeNav === 'partners' ? 'bg-[#1ac1b9] text-slate-950 shadow-md' : 'admin-subcard opacity-70 hover:opacity-100'}`}
              >
                🤝 3. Logo Mitra Running Marquee ({partnersList.length})
              </button>
              <button 
                onClick={() => setActiveNav('theme')}
                className={`px-4 py-2.5 rounded-xl font-black text-xs transition-all cursor-pointer ${activeNav === 'theme' ? 'bg-[#1ac1b9] text-slate-950 shadow-md' : 'admin-subcard opacity-70 hover:opacity-100'}`}
              >
                ⚙️ 4. Panel Tema Admin & Tampilan
              </button>
              <button 
                onClick={handleResetDefaults}
                className="px-3.5 py-2 rounded-xl font-bold text-xs bg-rose-900/40 hover:bg-rose-900 text-rose-300 border border-rose-800/50 transition-all cursor-pointer ml-auto"
              >
                🔄 Reset Default
              </button>
            </div>

            {/* TAB 1: HERO CONFIG */}
            {activeNav === 'hero' && (
              <div className="space-y-6">
                <div className="admin-card p-6 space-y-4 rounded-3xl">
                  <h2 className="text-sm font-extrabold text-teal-400 uppercase tracking-wider border-b border-slate-700/50 pb-3">
                    ✏️ Pengaturan Teks Banner Utama (Hero Section)
                  </h2>

                  <div className="space-y-4 text-xs">
                    <div>
                      <label className="font-bold block mb-1">Judul Utama (Baris Pertama):</label>
                      <input 
                        type="text" 
                        value={heroConfig.headingPre}
                        onChange={(e) => setHeroConfig({...heroConfig, headingPre: e.target.value})}
                        className="w-full admin-input rounded-xl p-3 font-bold text-sm"
                      />
                    </div>

                    <div>
                      <label className="font-bold block mb-1">Teks Sorotan (Warna Kuning Highlight):</label>
                      <input 
                        type="text" 
                        value={heroConfig.headingHighlight}
                        onChange={(e) => setHeroConfig({...heroConfig, headingHighlight: e.target.value})}
                        className="w-full admin-input rounded-xl p-3 text-amber-500 font-bold text-sm"
                      />
                    </div>

                    <div>
                      <label className="font-bold block mb-1">Deskripsi Pembuka Platform:</label>
                      <textarea 
                        rows="3"
                        value={heroConfig.description}
                        onChange={(e) => setHeroConfig({...heroConfig, description: e.target.value})}
                        className="w-full admin-input rounded-xl p-3"
                      ></textarea>
                    </div>
                  </div>
                </div>

                {/* THEME PRESETS FOR WEBSITE */}
                <div className="admin-card p-6 space-y-4 rounded-3xl">
                  <h2 className="text-sm font-extrabold text-teal-400 uppercase tracking-wider border-b border-slate-700/50 pb-3">
                    🎨 Pilihan Palet Gradasi Banner Website Utama (index.html)
                  </h2>

                  <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 text-xs">
                    <button 
                      onClick={() => setHeroConfig({...heroConfig, gradientBg: 'from-[#064e3b] via-[#047857] to-[#022c22]'})}
                      className={`p-4 rounded-2xl border text-left bg-gradient-to-r from-[#064e3b] via-[#047857] to-[#022c22] text-white cursor-pointer ${heroConfig.gradientBg.includes('#064e3b') ? 'ring-2 ring-amber-400 border-white shadow-xl' : 'border-slate-700'}`}
                    >
                      <span className="font-black text-sm block">Deep Emerald (#064E3B)</span>
                      <span className="text-emerald-200 text-[11px]">Tema Modern Luxury NARA</span>
                    </button>

                    <button 
                      onClick={() => setHeroConfig({...heroConfig, gradientBg: 'from-[#0f4c4a] via-[#136663] to-[#0d7873]'})}
                      className={`p-4 rounded-2xl border text-left bg-gradient-to-r from-[#0f4c4a] via-[#136663] to-[#0d7873] text-white cursor-pointer ${heroConfig.gradientBg.includes('#0f4c4a') ? 'ring-2 ring-amber-400 border-white shadow-xl' : 'border-slate-700'}`}
                    >
                      <span className="font-black text-sm block">Teal Beams (#1AC1B9)</span>
                      <span className="text-teal-200 text-[11px]">Cyan Dynamic Theme</span>
                    </button>

                    <button 
                      onClick={() => setHeroConfig({...heroConfig, gradientBg: 'from-[#1e3a8a] via-[#1d4ed8] to-[#1e40af]'})}
                      className={`p-4 rounded-2xl border text-left bg-gradient-to-r from-[#1e3a8a] via-[#1d4ed8] to-[#1e40af] text-white cursor-pointer ${heroConfig.gradientBg.includes('#1e3a8a') ? 'ring-2 ring-amber-400 border-white shadow-xl' : 'border-slate-700'}`}
                    >
                      <span className="font-black text-sm block">Royal Navy Blue</span>
                      <span className="text-blue-200 text-[11px]">Corporate Institutional</span>
                    </button>

                    <button 
                      onClick={() => setHeroConfig({...heroConfig, gradientBg: 'from-[#78350f] via-[#b45309] to-[#d97706]'})}
                      className={`p-4 rounded-2xl border text-left bg-gradient-to-r from-[#78350f] via-[#b45309] to-[#d97706] text-white cursor-pointer ${heroConfig.gradientBg.includes('#78350f') ? 'ring-2 ring-amber-400 border-white shadow-xl' : 'border-slate-700'}`}
                    >
                      <span className="font-black text-sm block">Luxury Gold</span>
                      <span className="text-amber-200 text-[11px]">Exclusive VIP Deal</span>
                    </button>
                  </div>
                </div>
              </div>
            )}

            {/* TAB 2: DEALS CARDS */}
            {activeNav === 'deals' && (
              <div className="space-y-6">
                
                {/* Form Tambah Deal Baru */}
                <form onSubmit={handleAddCardSubmit} className="admin-card p-6 space-y-4 rounded-3xl">
                  <h2 className="text-sm font-extrabold text-teal-400 uppercase tracking-wider border-b border-slate-700/50 pb-3 flex items-center gap-2">
                    <span>➕ Tambah Card Promosi / Proposal Baru</span>
                  </h2>

                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4 text-xs">
                    <div>
                      <label className="font-bold block mb-1">Judul Penawaran:</label>
                      <input 
                        type="text" 
                        required
                        placeholder="Contoh: Proposal Investasi Ruko Hook Profit 30%"
                        value={newCard.title}
                        onChange={(e) => setNewCard({...newCard, title: e.target.value})}
                        className="w-full admin-input rounded-xl p-3"
                      />
                    </div>

                    <div>
                      <label className="font-bold block mb-1">Badge Category (Misal: 💎 Mini Investment):</label>
                      <input 
                        type="text" 
                        required
                        value={newCard.badge}
                        onChange={(e) => setNewCard({...newCard, badge: e.target.value})}
                        className="w-full admin-input rounded-xl p-3"
                      />
                    </div>

                    <div>
                      <label className="font-bold block mb-1">Profit / Price Tag (Misal: Profit 25% p.a.):</label>
                      <input 
                        type="text" 
                        required
                        value={newCard.profitTag}
                        onChange={(e) => setNewCard({...newCard, profitTag: e.target.value})}
                        className="w-full admin-input rounded-xl p-3 text-amber-500 font-bold"
                      />
                    </div>

                    <div>
                      <label className="font-bold block mb-1">Lokasi:</label>
                      <input 
                        type="text" 
                        required
                        value={newCard.location}
                        onChange={(e) => setNewCard({...newCard, location: e.target.value})}
                        className="w-full admin-input rounded-xl p-3"
                      />
                    </div>
                  </div>

                  <div className="text-xs">
                    <label className="font-bold block mb-1">URL Gambar Header Card:</label>
                    <input 
                      type="text" 
                      required
                      value={newCard.image}
                      onChange={(e) => setNewCard({...newCard, image: e.target.value})}
                      className="w-full admin-input rounded-xl p-3 font-mono text-xs"
                    />
                  </div>

                  <div className="text-xs">
                    <label className="font-bold block mb-1">Deskripsi Ringkas Penawaran:</label>
                    <textarea 
                      rows="2"
                      required
                      placeholder="Jelaskan detail skema keuntungan atau garansi NARA Escrow..."
                      value={newCard.description}
                      onChange={(e) => setNewCard({...newCard, description: e.target.value})}
                      className="w-full admin-input rounded-xl p-3"
                    ></textarea>
                  </div>

                  <button 
                    type="submit"
                    className="px-6 py-3 bg-[#1ac1b9] hover:bg-[#16a39d] text-slate-950 font-black text-xs rounded-xl shadow-lg cursor-pointer transition-all"
                  >
                    ➕ Tambahkan Card Ke Draf CMS
                  </button>
                </form>

                {/* List Cards */}
                <div className="admin-card p-6 space-y-4 rounded-3xl">
                  <h2 className="text-sm font-extrabold text-teal-400 uppercase tracking-wider border-b border-slate-700/50 pb-3">
                    📋 Daftar Cards Promo Aktif ({needsCardsList.length} Cards)
                  </h2>

                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4 text-xs">
                    {needsCardsList.map(c => (
                      <div key={c.id} className="admin-subcard p-4 rounded-2xl space-y-3 flex flex-col justify-between">
                        <div className="flex gap-3">
                          <img src={c.image} className="w-16 h-16 rounded-xl object-cover shrink-0" />
                          <div>
                            <span className="text-[10px] font-bold text-amber-500 block">{c.profitTag}</span>
                            <h3 className="font-bold text-sm leading-snug">{c.title}</h3>
                            <p className="text-[11px] opacity-75">📍 {c.location}</p>
                          </div>
                        </div>

                        <div className="pt-2 border-t border-slate-700/30 flex justify-between items-center">
                          <span className="text-[10px] text-teal-500 font-mono">{c.badge}</span>
                          <button 
                            type="button"
                            onClick={() => handleDeleteCard(c.id)}
                            className="px-3 py-1 bg-rose-950/60 hover:bg-rose-900 text-rose-300 font-bold text-xs rounded-lg border border-rose-800 cursor-pointer"
                          >
                            🗑️ Hapus Card
                          </button>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>

              </div>
            )}

            {/* TAB 3: PARTNERS LOGO */}
            {activeNav === 'partners' && (
              <div className="space-y-6">
                
                {/* Form Tambah Partner */}
                <form onSubmit={handleAddPartnerSubmit} className="admin-card p-6 space-y-4 rounded-3xl">
                  <h2 className="text-sm font-extrabold text-teal-400 uppercase tracking-wider border-b border-slate-700/50 pb-3 flex items-center gap-2">
                    <span>🤝 Tambah Mitra / Logo Baru Ke Marquee Slider</span>
                  </h2>

                  <div className="flex gap-3 text-xs">
                    <input 
                      type="text" 
                      required
                      placeholder="Masukkan nama mitra/perusahaan baru..."
                      value={newPartnerName}
                      onChange={(e) => setNewPartnerName(e.target.value)}
                      className="flex-1 admin-input rounded-xl p-3"
                    />

                    <button 
                      type="submit"
                      className="px-6 py-3 bg-[#1ac1b9] hover:bg-[#16a39d] text-slate-950 font-black text-xs rounded-xl shadow-lg cursor-pointer transition-all"
                    >
                      ➕ Tambahkan
                    </button>
                  </div>
                </form>

                {/* List Partners */}
                <div className="admin-card p-6 space-y-4 rounded-3xl">
                  <h2 className="text-sm font-extrabold text-teal-400 uppercase tracking-wider border-b border-slate-700/50 pb-3">
                    📋 Daftar Mitra Running Marquee ({partnersList.length} Partners)
                  </h2>

                  <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3 text-xs">
                    {partnersList.map(p => (
                      <div key={p.id} className="admin-subcard p-3.5 rounded-xl flex justify-between items-center">
                        <div className="flex items-center gap-2">
                          <span className="text-lg">{p.icon || '🤝'}</span>
                          <span className="font-extrabold">{p.name}</span>
                        </div>

                        <button 
                          type="button"
                          onClick={() => handleDeletePartner(p.id)}
                          className="px-2.5 py-1 bg-rose-950/60 hover:bg-rose-900 text-rose-300 font-bold text-[11px] rounded-lg border border-rose-800 cursor-pointer"
                        >
                          🗑️ Hapus
                        </button>
                      </div>
                    ))}
                  </div>
                </div>

              </div>
            )}

            {/* TAB 4: THEME SWITCHER PANEL */}
            {activeNav === 'theme' && (
              <div className="space-y-6">
                <div className="admin-card p-6 space-y-6 rounded-3xl">
                  <div className="border-b border-slate-700/50 pb-3">
                    <h2 className="text-sm font-extrabold text-teal-400 uppercase tracking-wider">
                      🎨 Panel Pengaturan Tema Gelap / Terang CMS Admin
                    </h2>
                    <p className="text-xs opacity-75 mt-1">Pilih tampilan antarmuka yang paling nyaman untuk manajemen harian Anda.</p>
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-3 gap-4 text-xs">
                    
                    {/* Dark Option */}
                    <div 
                      onClick={() => changeTheme('dark')}
                      className={`p-5 rounded-2xl border-2 cursor-pointer transition-all space-y-3 ${adminTheme === 'dark' ? 'border-[#1ac1b9] bg-slate-900/90 ring-4 ring-teal-500/20' : 'admin-subcard border-transparent hover:border-slate-500'}`}
                    >
                      <div className="flex justify-between items-center">
                        <span className="text-xl">🌙</span>
                        {adminTheme === 'dark' && <span className="bg-teal-500 text-slate-950 text-[10px] font-black px-2 py-0.5 rounded-full">AKTIF</span>}
                      </div>
                      <div>
                        <strong className="text-sm font-extrabold block">Mode Gelap (Slate Navy)</strong>
                        <p className="text-[11px] opacity-75 mt-0.5">Latar gelap kontras tinggi, ideal untuk kerja malam & mengurangi ketegangan mata.</p>
                      </div>
                    </div>

                    {/* Light Option */}
                    <div 
                      onClick={() => changeTheme('light')}
                      className={`p-5 rounded-2xl border-2 cursor-pointer transition-all space-y-3 ${adminTheme === 'light' ? 'border-[#1ac1b9] bg-white text-slate-900 ring-4 ring-teal-500/20 shadow-md' : 'admin-subcard border-transparent hover:border-slate-500'}`}
                    >
                      <div className="flex justify-between items-center">
                        <span className="text-xl">☀️</span>
                        {adminTheme === 'light' && <span className="bg-teal-500 text-slate-950 text-[10px] font-black px-2 py-0.5 rounded-full">AKTIF</span>}
                      </div>
                      <div>
                        <strong className="text-sm font-extrabold block">Mode Terang (Clean Light)</strong>
                        <p className="text-[11px] opacity-75 mt-0.5">Latar putih bersih dengan kartu berbayang halus, sangat jelas di ruangan terang.</p>
                      </div>
                    </div>

                    {/* Emerald Option */}
                    <div 
                      onClick={() => changeTheme('emerald')}
                      className={`p-5 rounded-2xl border-2 cursor-pointer transition-all space-y-3 ${adminTheme === 'emerald' ? 'border-[#f59e0b] bg-emerald-950 text-white ring-4 ring-amber-500/20' : 'admin-subcard border-transparent hover:border-slate-500'}`}
                    >
                      <div className="flex justify-between items-center">
                        <span className="text-xl">🌲</span>
                        {adminTheme === 'emerald' && <span className="bg-amber-400 text-slate-950 text-[10px] font-black px-2 py-0.5 rounded-full">AKTIF</span>}
                      </div>
                      <div>
                        <strong className="text-sm font-extrabold block">Mode Emerald Luxury</strong>
                        <p className="text-[11px] opacity-75 mt-0.5">Nuansa hijau botol mewah khas NARA dengan aksen emas yang prestisius.</p>
                      </div>
                    </div>

                  </div>
                </div>
              </div>
            )}

          </main>

          {/* FOOTER BAR */}
          <footer className="admin-header py-4 text-center text-xs opacity-60">
            © 2026 NaraEcosystem® Standalone CMS Admin Portal. All Changes Sync to index.html & tentang.html.
          </footer>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<AdminCMSApp />);
  </script>
</body>
</html>
